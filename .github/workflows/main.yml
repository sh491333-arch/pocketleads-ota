name: Build PocketLeads APK & Publish OTA Update

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Android Engine & Sync PocketLeads-latest.zip for OTA Live Update
        run: |
          python3 - << 'EOF'
          import os, json, shutil, zipfile, datetime
          from pathlib import Path

          engine_zip = Path("android-engine.zip")
          if engine_zip.exists():
              with zipfile.ZipFile(engine_zip, "r") as zf:
                  zf.extractall(".")

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          branch = os.environ.get("GITHUB_REF_NAME", "main")
          raw_base = f"https://raw.githubusercontent.com/{repo}/{branch}" if repo else "__OTA_BASE_URL__"

          strings_path = Path("app/src/main/res/values/strings.xml")
          if strings_path.exists() and repo:
              txt = strings_path.read_text(encoding="utf-8")
              txt = txt.replace("__OTA_BASE_URL__", raw_base)
              strings_path.write_text(txt, encoding="utf-8")

          zip_path = Path("PocketLeads-latest.zip")
          assets_ext = Path("app/src/main/assets/pocketleads")
          assets_core = Path("app/src/main/assets/android_core")

          tmp_dir = Path("/tmp/pl_extract")
          if tmp_dir.exists():
              shutil.rmtree(tmp_dir)
          tmp_dir.mkdir(parents=True)
          with zipfile.ZipFile(zip_path, "r") as zf:
              zf.extractall(tmp_dir)

          manifest_files = list(tmp_dir.rglob("manifest.json"))
          ext_root = manifest_files[0].parent if manifest_files else tmp_dir
          if assets_ext.exists():
              shutil.rmtree(assets_ext)
          shutil.copytree(ext_root, assets_ext)

          if assets_core.exists():
              for f in assets_core.iterdir():
                  if f.is_file():
                      shutil.copyfile(f, assets_ext / f.name)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed Release & Debug APK
        run: |
          gradle assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk PocketLeads-PRO.apk

      - name: Upload Ready-to-Install PocketLeads-PRO.apk
        uses: actions/upload-artifact@v4
        with:
          name: PocketLeads-PRO-APK-Download
          path: |
            PocketLeads-PRO.apk

  build-windows-exe:
    runs-on: windows-latest
    if: hashFiles('desktop-engine.zip') != ''
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unpack Desktop Engine & Sync PocketLeads-latest.zip
        shell: python
        run: |
          import os, shutil, zipfile
          from pathlib import Path

          with zipfile.ZipFile("desktop-engine.zip", "r") as zf:
              zf.extractall(".")

          app_dir = Path("desktop_app")
          ext_dest = app_dir / "pocketleads"
          core_dest = app_dir / "android_core"
          if ext_dest.exists():
              shutil.rmtree(ext_dest)

          tmp_ext = Path("tmp_ext_win")
          if tmp_ext.exists():
              shutil.rmtree(tmp_ext)
          tmp_ext.mkdir(parents=True)
          with zipfile.ZipFile("PocketLeads-latest.zip", "r") as zf:
              zf.extractall(tmp_ext)
          manifests = list(tmp_ext.rglob("manifest.json"))
          ext_root = manifests[0].parent if manifests else tmp_ext
          shutil.copytree(ext_root, ext_dest)

          if Path("android-engine.zip").exists():
              tmp_eng = Path("tmp_eng_win")
              with zipfile.ZipFile("android-engine.zip", "r") as zf:
                  zf.extractall(tmp_eng)
              src_core = tmp_eng / "app" / "src" / "main" / "assets" / "android_core"
              if src_core.exists():
                  if core_dest.exists():
                      shutil.rmtree(core_dest)
                  shutil.copytree(src_core, core_dest)

      - name: Build Windows Desktop .EXE (Setup + Portable)
        working-directory: desktop_app
        run: |
          npm install
          npx electron-builder --win nsis portable

      - name: Upload Ready-to-Install Windows Desktop .EXE
        uses: actions/upload-artifact@v4
        with:
          name: PocketLeads-PRO-Windows-Desktop-EXE
          path: |
            desktop_app/dist/*.exe
