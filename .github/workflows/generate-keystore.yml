name: Generate Permanent Android Keystore (1-Click)

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore Password (blank = auto-generate)'
        required: false
        default: ''
      key_alias:
        description: 'Key Alias'
        required: true
        default: 'pocketleads'

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Permanent .jks Keystore & Base64
        shell: bash
        run: |
          mkdir -p keystore_output
          ALIAS="${{ github.event.inputs.key_alias }}"
          PASS="${{ github.event.inputs.keystore_password }}"
          if [ -z "$PASS" ]; then
            PASS=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 16)
          fi
          keytool -genkeypair -v \
            -keystore keystore_output/pocketleads-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=PocketLeads PRO, OU=Mobile, O=PocketLeads, L=Kolkata, ST=WB, C=IN"
          base64 -w 0 keystore_output/pocketleads-release.jks > keystore_output/KEYSTORE_BASE64.txt
          printf "1. KEY_ALIAS:\n%s\n\n2. KEYSTORE_PASSWORD:\n%s\n\n3. KEY_PASSWORD:\n%s\n\n4. KEYSTORE_BASE64:\n(Copy full text from KEYSTORE_BASE64.txt)\n" "$ALIAS" "$PASS" "$PASS" > keystore_output/COPY_TO_GITHUB_SECRETS.txt

      - name: Upload Private Keystore Backup (1-day auto-delete)
        uses: actions/upload-artifact@v4
        with:
          name: PocketLeads-Permanent-Keystore-BACKUP
          path: keystore_output/
          retention-days: 1
